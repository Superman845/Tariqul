<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice Tutor</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --error-color: #f44336;
            --success-color: #4CAF50;
            --key-bg: #f0f0f0;
            --key-border: #ccc;
            --key-active: #e0e0e0;
            --panel-bg: #f9f9f9;
            --border-color: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --key-bg: #333333;
            --key-border: #555555;
            --key-active: #444444;
            --panel-bg: #2a2a2a;
            --border-color: #555555;
        }

        [data-theme="night"] {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --key-bg: #21262d;
            --key-border: #30363d;
            --key-active: #373e47;
            --panel-bg: #161b22;
            --border-color: #30363d;
        }

        [data-theme="blue"] {
            --bg-color: #e3f2fd;
            --text-color: #0d47a1;
            --key-bg: #bbdefb;
            --key-border: #90caf9;
            --key-active: #64b5f6;
            --panel-bg: #f3e5f5;
            --border-color: #90caf9;
        }

        [data-theme="green"] {
            --bg-color: #e8f5e8;
            --text-color: #1b5e20;
            --key-bg: #c8e6c9;
            --key-border: #a5d6a7;
            --key-active: #81c784;
            --panel-bg: #f1f8e9;
            --border-color: #a5d6a7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .level-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .level-btn, .lesson-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: var(--key-bg);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-btn:hover, .lesson-btn:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .level-btn.active, .lesson-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .settings-btn {
            padding: 10px 20px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .stats-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--panel-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.7;
        }

        .typing-area {
            margin-bottom: 20px;
        }

        .text-display {
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: var(--panel-bg);
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            min-height: 100px;
            overflow-y: auto;
            resize: vertical;
        }

        .char {
            font-size: inherit;
            transition: all 0.2s ease;
        }

        .char.correct {
            color: var(--success-color);
            background-color: rgba(76, 175, 80, 0.1);
        }

        .char.incorrect {
            color: var(--error-color);
            background-color: rgba(244, 67, 54, 0.1);
        }

        .char.current {
            background-color: var(--secondary-color);
            color: white;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .finger-hint {
            margin: 10px 0;
            padding: 10px;
            background: var(--panel-bg);
            border-radius: 5px;
            border: 1px solid var(--border-color);
            font-weight: bold;
            text-align: center;
        }

        .lesson-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .control-btn {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            background: var(--key-bg);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .keyboard {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            user-select: none;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .key {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            background: var(--key-bg);
            border: 2px solid var(--key-border);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            position: relative;
        }

        .key:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .key.active {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .key.next {
            background: var(--secondary-color);
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .key.space {
            min-width: 200px;
        }

        .key.shift, .key.ctrl, .key.alt {
            min-width: 60px;
        }

        .key.tab {
            min-width: 50px;
        }

        .key.caps {
            min-width: 70px;
        }

        .key.enter {
            min-width: 80px;
        }

        .key.backspace {
            min-width: 80px;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: var(--panel-bg);
            border-left: 2px solid var(--border-color);
            padding: 20px;
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .close-btn {
            background: var(--error-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #d32f2f;
            transform: scale(1.1);
        }

        .setting-group {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-color);
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .setting-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .setting-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .setting-select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            border: 2px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .level-card {
            padding: 15px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .level-card:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .level-card.active {
            background: var(--primary-color);
            color: white;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .lesson-card {
            padding: 10px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .lesson-card:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .lesson-card.active {
            background: var(--primary-color);
            color: white;
        }

        .custom-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-btn:hover {
            background: #1976D2;
            transform: scale(1.1);
        }

        .music-controls {
            position: fixed;
            top: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .music-btn {
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-btn:hover {
            background: #45a049;
            transform: scale(1.1);
        }

        .music-btn.playing {
            background: var(--error-color);
            animation: pulse 2s infinite;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header {
                flex-direction: column;
                gap: 10px;
            }
            
            .stats-display {
                flex-direction: column;
                gap: 10px;
            }
            
            .keyboard {
                padding: 10px;
            }
            
            .key {
                min-width: 30px;
                height: 30px;
                font-size: 12px;
            }
            
            .settings-panel {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <div class="header">
            <div class="level-selector">
                <button class="level-btn active" onclick="openLevelsModal()">Levels</button>
                <button class="lesson-btn" onclick="openLessonsModal()">Lessons</button>
                <button class="control-btn" onclick="showStats()">Stats</button>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
        </div>

        <div class="stats-display">
            <div class="stat-item">
                <div class="stat-value" id="accuracy">100%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="speed">0</div>
                <div class="stat-label">WPM</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="errors">0</div>
                <div class="stat-label">Errors</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="time">0:00</div>
                <div class="stat-label">Time</div>
            </div>
        </div>

        <div class="typing-area">
            <div class="text-display" id="textDisplay"></div>
            <div class="finger-hint" id="fingerHint">Position your fingers on the home row</div>
        </div>

        <div class="lesson-controls">
            <button class="control-btn" onclick="restartLesson()">🔄 Restart</button>
            <button class="control-btn" onclick="nextLesson()">⏭️ Next Lesson</button>
        </div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3>Settings</h3>
            <button class="close-btn" onclick="closeSettings()">❌</button>
        </div>

        <div class="setting-group">
            <label class="setting-label">Theme</label>
            <select class="setting-select" id="themeSelect" onchange="changeTheme()">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="night">Night</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">Font Size</label>
            <input type="range" class="setting-input" id="fontSizeSlider" min="12" max="24" value="16" oninput="changeFontSize()">
            <span id="fontSizeValue">16px</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Zoom Level</label>
            <input type="range" class="setting-input" id="zoomSlider" min="50" max="200" value="100" oninput="changeZoom()">
            <span id="zoomValue">100%</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Keyboard Size</label>
            <input type="range" class="setting-input" id="keyboardSizeSlider" min="0.5" max="2" step="0.1" value="1" oninput="changeKeyboardSize()">
            <span id="keyboardSizeValue">100%</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Mistake Sound</label>
            <select class="setting-select" id="soundSelect" onchange="changeMistakeSound()">
                <option value="sound1">Sound 1</option>
                <option value="sound2">Sound 2</option>
                <option value="sound3">Sound 3</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">Text Box Rows</label>
            <input type="range" class="setting-input" id="textBoxRowsSlider" min="1" max="5" value="3" oninput="changeTextBoxRows()">
            <span id="textBoxRowsValue">3 rows</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Keyboard Theme</label>
            <select class="setting-select" id="keyboardThemeSelect" onchange="changeKeyboardTheme()">
                <option value="default">Default</option>
                <option value="gaming">Gaming</option>
                <option value="retro">Retro</option>
                <option value="neon">Neon</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">Background Music</label>
            <select class="setting-select" id="musicSelect" onchange="changeBackgroundMusic()">
                <option value="none">None</option>
                <option value="peaceful1">Peaceful Piano</option>
                <option value="peaceful2">Nature Sounds</option>
                <option value="peaceful3">Ambient Waves</option>
            </select>
            <div style="margin-top: 10px;">
                <label class="setting-label">Volume</label>
                <input type="range" class="setting-input" id="musicVolumeSlider" min="0" max="1" step="0.1" value="0.3" oninput="changeMusicVolume()">
                <span id="musicVolumeValue">30%</span>
            </div>
        </div>
    </div>

    <!-- Levels Modal -->
    <div class="modal" id="levelsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select Level</h3>
                <button class="close-btn" onclick="closeLevelsModal()">×</button>
            </div>
            <div class="custom-controls">
                <button class="control-btn" onclick="addCustomLevel()">Add Level</button>
                <button class="control-btn" onclick="editLevel()">Edit</button>
                <button class="control-btn" onclick="deleteLevel()">Delete</button>
                <button class="control-btn" onclick="resetLevels()">Reset</button>
            </div>
            <div class="levels-grid" id="levelsGrid"></div>
        </div>
    </div>

    <!-- Lessons Modal -->
    <div class="modal" id="lessonsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select Lesson</h3>
                <button class="close-btn" onclick="closeLessonsModal()">×</button>
            </div>
            <div class="custom-controls">
                <button class="control-btn" onclick="addCustomLesson()">Add Lesson</button>
                <button class="control-btn" onclick="editLesson()">Edit</button>
                <button class="control-btn" onclick="deleteLesson()">Delete</button>
                <button class="control-btn" onclick="resetLessons()">Reset</button>
            </div>
            <div class="lessons-grid" id="lessonsGrid"></div>
        </div>
    </div>

    <!-- Fullscreen Button -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

    <!-- Music Controls -->
    <div class="music-controls">
        <button class="music-btn" id="musicToggle" onclick="toggleMusic()">🎵</button>
    </div>

    <!-- Hidden Audio Elements -->
    <audio id="backgroundMusic" loop>
        <source id="musicSource" src="" type="audio/mpeg">
    </audio>

            'q': 'left pinky', 'w': 'left ring', 'e': 'left middle', 'r': 'left index', 't': 'left index',
            'y': 'right index', 'u': 'right index', 'i': 'right middle', 'o': 'right ring', 'p': 'right pinky',
            'a': 'left pinky', 's': 'left ring', 'd': 'left middle', 'f': 'left index', 'g': 'left index',
            'h': 'right index', 'j': 'right index', 'k': 'right middle', 'l': 'right ring', ';': 'right pinky',
            'z': 'left pinky', 'x': 'left ring', 'c': 'left middle', 'v': 'left index', 'b': 'left index',
            'n': 'right index', 'm': 'right index', ',': 'right middle', '.': 'right ring', '/': 'right pinky',
            ' ': 'thumbs', '1': 'left pinky', '2': 'left ring', '3': 'left middle', '4': 'left index', '5': 'left index',
            '6': 'right index', '7': 'right index', '8': 'right middle', '9': 'right ring', '0': 'right pinky'
        };

        // Initialize the application
        function init() {
            loadSettings();
            createKeyboard();
            loadLevels();
            loadLessons();
            generateMistakeSounds();
            generateBackgroundMusic();
            loadLesson();
            
            // Add event listeners
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            document.addEventListener('click', handleBodyClick);
            
            // Request fullscreen on load
            setTimeout(() => {
                enterFullscreen();
            }, 100);
        }

        // Create virtual keyboard
        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            const rows = [
                ['`', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', 'backspace'],
                ['tab', 'q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', '[', ']', '\\'],
                ['caps', 'a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', "'", 'enter'],
                ['shift', 'z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/', 'shift'],
                ['ctrl', 'alt', 'space', 'alt', 'ctrl']
            ];

            keyboard.innerHTML = '';
            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                
                row.forEach(key => {
                    const keyDiv = document.createElement('div');
                    keyDiv.className = `key ${key}`;
                    keyDiv.setAttribute('data-key', key);
                    
                    if (key === 'space') {
                        keyDiv.textContent = '';
                        keyDiv.className += ' space';
                    } else if (key === 'backspace') {
                        keyDiv.textContent = '⌫';
                        keyDiv.className += ' backspace';
                    } else if (key === 'enter') {
                        keyDiv.textContent = '↵';
                        keyDiv.className += ' enter';
                    } else if (key === 'shift') {
                        keyDiv.textContent = '⇧';
                        keyDiv.className += ' shift';
                    } else if (key === 'tab') {
                        keyDiv.textContent = '⇥';
                        keyDiv.className += ' tab';
                    } else if (key === 'caps') {
                        keyDiv.textContent = '⇪';
                        keyDiv.className += ' caps';
                    } else if (key === 'ctrl') {
                        keyDiv.textContent = 'Ctrl';
                        keyDiv.className += ' ctrl';
                    } else if (key === 'alt') {
                        keyDiv.textContent = 'Alt';
                        keyDiv.className += ' alt';
                    } else {
                        keyDiv.textContent = key;
                    }
                    
                    rowDiv.appendChild(keyDiv);
                });
                
                keyboard.appendChild(rowDiv);
            });
        }

        // Handle key press
        function handleKeyDown(event) {
            const key = event.key;
            const keyCode = event.keyCode;
            
            // Handle shift key
            if (key === 'Shift') {
                isShiftPressed = true;
                updateKeyboardShift();
                return;
            }
            
            // Prevent default behavior for typing keys
            if (keyCode >= 32 && keyCode <= 126) {
                event.preventDefault();
            }
            
            // Highlight pressed key
            highlightKey(key);
            
            // Process the typed character
            processTypedCharacter(key);
        }

        function handleKeyUp(event) {
            const key = event.key;
            
            if (key === 'Shift') {
                isShiftPressed = false;
                updateKeyboardShift();
            }
            
            // Remove highlight from key
            removeKeyHighlight(key);
        }

        // Update keyboard display for shift state
        function updateKeyboardShift() {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                const keyData = key.getAttribute('data-key');
                if (isShiftPressed) {
                    switch(keyData) {
                        case '1': key.textContent = '!'; break;
                        case '2': key.textContent = '@'; break;
                        case '3': key.textContent = '#'; break;
                        case '4': key.textContent = '$'; break;
                        case '5': key.textContent = '%'; break;
                        case '6': key.textContent = '^'; break;
                        case '7': key.textContent = '&'; break;
                        case '8': key.textContent = '*'; break;
                        case '9': key.textContent = '('; break;
                        case '0': key.textContent = ')'; break;
                        case '-': key.textContent = '_'; break;
                        case '=': key.textContent = '+'; break;
                        case '[': key.textContent = '{'; break;
                        case ']': key.textContent = '}'; break;
                        case '\\': key.textContent = '|'; break;
                        case ';': key.textContent = ':'; break;
                        case "'": key.textContent = '"'; break;
                        case ',': key.textContent = '<'; break;
                        case '.': key.textContent = '>'; break;
                        case '/': key.textContent = '?'; break;
                        case '`': key.textContent = '~'; break;
                        default:
                            if (keyData.length === 1 && keyData.match(/[a-z]/)) {
                                key.textContent = keyData.toUpperCase();
                            }
                    }
                } else {
                    // Reset to normal state
                    if (keyData === 'space') {
                        key.textContent = '';
                    } else if (keyData === 'backspace') {
                        key.textContent = '⌫';
                    } else if (keyData === 'enter') {
                        key.textContent = '↵';
                    } else if (keyData === 'shift') {
                        key.textContent = '⇧';
                    } else if (keyData === 'tab') {
                        key.textContent = '⇥';
                    } else if (keyData === 'caps') {
                        key.textContent = '⇪';
                    } else if (keyData === 'ctrl') {
                        key.textContent = 'Ctrl';
                    } else if (keyData === 'alt') {
                        key.textContent = 'Alt';
                    } else {
                        key.textContent = keyData;
                    }
                }
            });
        }

        // Highlight key on keyboard
        function highlightKey(key) {
            const keyElement = document.querySelector(`[data-key="${key.toLowerCase()}"]`);
            if (keyElement) {
                keyElement.classList.add('active');
            }
            
            // Handle special keys
            if (key === ' ') {
                const spaceKey = document.querySelector('[data-key="space"]');
                if (spaceKey) spaceKey.classList.add('active');
            }
        }

        // Remove key highlight
        function removeKeyHighlight(key) {
            const keyElement = document.querySelector(`[data-key="${key.toLowerCase()}"]`);
            if (keyElement) {
                keyElement.classList.remove('active');
            }
            
            if (key === ' ') {
                const spaceKey = document.querySelector('[data-key="space"]');
                if (spaceKey) spaceKey.classList.remove('active');
            }
        }

        // Process typed character
        function processTypedCharacter(key) {
            if (currentIndex >= currentText.length) return;
            
            const expectedChar = currentText[currentIndex];
            const typedChar = key;
            
            // Start timer on first keypress
            if (startTime === null) {
                startTime = Date.now();
                startTimer();
            }
            
            const charElement = document.querySelector(`[data-index="${currentIndex}"]`);
            
            if (typedChar === expectedChar) {
                // Correct character
                charElement.classList.add('correct');
                correctChars++;
                currentIndex++;
                
                // Update next character highlight
                updateNextCharacterHighlight();
                updateFingerHint();
                
                // Check if lesson is complete
                if (currentIndex >= currentText.length) {
                    completeLesson();
                }
            } else {
                // Incorrect character
                charElement.classList.add('incorrect');
                errors++;
                playMistakeSound();
            }
            
            totalChars++;
            updateStats();
        }

        // Update next character highlight on keyboard
        function updateNextCharacterHighlight() {
            // Remove previous highlights
            document.querySelectorAll('.key.next').forEach(key => {
                key.classList.remove('next');
            });
            
            if (currentIndex < currentText.length) {
                const nextChar = currentText[currentIndex];
                let keyToHighlight = nextChar.toLowerCase();
                
                // Handle special characters
                if (nextChar === ' ') {
                    keyToHighlight = 'space';
                } else if (nextChar.match(/[A-Z]/)) {
                    keyToHighlight = nextChar.toLowerCase();
                    // Also highlight shift key
                    document.querySelectorAll('[data-key="shift"]').forEach(key => {
                        key.classList.add('next');
                    });
                } else if ('!@#$%^&*()_+{}|:"<>?~'.includes(nextChar)) {
                    // Handle shift + number/symbol combinations
                    const shiftMap = {
                        '!': '1', '@': '2', '#': '3', '$': '4', '%': '5',
                        '^': '6', '&': '7', '*': '8', '(': '9', ')': '0',
                        '_': '-', '+': '=', '{': '[', '}': ']', '|': '\\',
                        ':': ';', '"': "'", '<': ',', '>': '.', '?': '/',
                        '~': '`'
                    };
                    keyToHighlight = shiftMap[nextChar] || nextChar;
                    document.querySelectorAll('[data-key="shift"]').forEach(key => {
                        key.classList.add('next');
                    });
                }
                
                const keyElement = document.querySelector(`[data-key="${keyToHighlight}"]`);
                if (keyElement) {
                    keyElement.classList.add('next');
                }
            }
        }

        // Update finger hint
        function updateFingerHint() {
            const fingerHint = document.getElementById('fingerHint');
            
            if (currentIndex < currentText.length) {
                const nextChar = currentText[currentIndex].toLowerCase();
                const finger = fingerMap[nextChar] || 'appropriate finger';
                const charDisplay = currentText[currentIndex] === ' ' ? 'space' : currentText[currentIndex];
                
                let hint = `Next: "${charDisplay}" - Use ${finger}`;
                
                // Add shift instruction if needed
                if (currentText[currentIndex].match(/[A-Z]/) || '!@#$%^&*()_+{}|:"<>?~'.includes(currentText[currentIndex])) {
                    hint += ' (with Shift)';
                }
                
                fingerHint.textContent = hint;
            } else {
                fingerHint.textContent = 'Lesson complete!';
            }
        }

        // Load lesson text
        function loadLesson() {
            const levels = JSON.parse(localStorage.getItem('customLevels')) || defaultLevels;
            const lessons = JSON.parse(localStorage.getItem('customLessons')) || defaultLessons;
            
            currentText = lessons[currentLevel]?.[currentLesson] || 'Sample text for typing practice.';
            currentIndex = 0;
            errors = 0;
            correctChars = 0;
            totalChars = 0;
            startTime = null;
            
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            displayText();
            updateStats();
            updateNextCharacterHighlight();
            updateFingerHint();
        }

        // Display text with character spans
        function displayText() {
            const textDisplay = document.getElementById('textDisplay');
            textDisplay.innerHTML = '';
            
            for (let i = 0; i < currentText.length; i++) {
                const span = document.createElement('span');
                span.className = 'char';
                span.setAttribute('data-index', i);
                span.textContent = currentText[i];
                
                if (i === currentIndex) {
                    span.classList.add('current');
                }
                
                textDisplay.appendChild(span);
            }
        }

        // Update statistics
        function updateStats() {
            const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
            const timeElapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
            const wpm = timeElapsed > 0 ? Math.round((correctChars / 5) / (timeElapsed / 60)) : 0;
            
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('speed').textContent = wpm;
            document.getElementById('errors').textContent = errors;
        }

        // Start timer
        function startTimer() {
            timer = setInterval(() => {
                if (startTime) {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('time').textContent = 
                        `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Complete lesson
        function completeLesson() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            // Save lesson statistics
            saveLessonStats();
            
            // Show completion message
            setTimeout(() => {
                alert('Lesson completed! Great job!');
            }, 500);
        }

        // Save lesson statistics
        function saveLessonStats() {
            const stats = JSON.parse(localStorage.getItem('lessonStats')) || {};
            const key = `${currentLevel}-${currentLesson}`;
            
            const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
            const timeElapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
            const wpm = timeElapsed > 0 ? Math.round((correctChars / 5) / (timeElapsed / 60)) : 0;
            
            stats[key] = {
                accuracy,
                wpm,
                errors,
                time: timeElapsed,
                date: new Date().toISOString()
            };
            
            localStorage.setItem('lessonStats', JSON.stringify(stats));
        }

        // Generate mistake sounds
        function generateMistakeSounds() {
            // Generate different mistake sounds using Web Audio API
            const frequencies = [800, 600, 400];
            
            frequencies.forEach((freq, index) => {
                const soundKey = `sound${index + 1}`;
                mistakeSounds[soundKey] = () => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                };
            });
        }

        // Play mistake sound
        function playMistakeSound() {
            if (mistakeSounds[currentMistakeSound]) {
                mistakeSounds[currentMistakeSound]();
            }
        }

        // Load levels into modal
        function loadLevels() {
            const levels = JSON.parse(localStorage.getItem('customLevels')) || defaultLevels;
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';
            
            Object.keys(levels).forEach(levelKey => {
                const level = levels[levelKey];
                const card = document.createElement('div');
                card.className = 'level-card';
                if (levelKey === currentLevel) {
                    card.classList.add('active');
                }
                
                card.innerHTML = `
                    <h4>${level.name}</h4>
                    <p>${level.description}</p>
                `;
                
                card.onclick = () => {
                    currentLevel = levelKey;
                    currentLesson = 1;
                    loadLesson();
                    closeLevelsModal();
                };
                
                grid.appendChild(card);
            });
        }

        // Load lessons into modal
        function loadLessons() {
            const lessons = JSON.parse(localStorage.getItem('customLessons')) || defaultLessons;
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';
            
            const currentLevelLessons = lessons[currentLevel] || {};
            
            Object.keys(currentLevelLessons).forEach(lessonKey => {
                const card = document.createElement('div');
                card.className = 'lesson-card';
                if (parseInt(lessonKey) === currentLesson) {
                    card.classList.add('active');
                }
                
                card.innerHTML = `<h4>Lesson ${lessonKey}</h4>`;
                
                card.onclick = () => {
                    currentLesson = parseInt(lessonKey);
                    loadLesson();
                    closeLessonsModal();
                };
                
                grid.appendChild(card);
            });
        }

                const levels = JSON.parse(localStorage.getItem('customLevels')) || defaultLevels;
                const key = name.toLowerCase().replace(/\s+/g, '_');
                levels[key] = { name, description };
                localStorage.setItem('customLevels', JSON.stringify(levels));
                loadLevels();

            const text = prompt('Enter lesson text:');

                if (!lessons[currentLevel]) {
                    lessons[currentLevel] = {};

                const lessonNumber = Object.keys(lessons[currentLevel]).length + 1;
                lessons[currentLevel][lessonNumber] = text;
                localStorage.setItem('customLessons', JSON.stringify(lessons));
                loadLessons();
            }

        // Fullscreen functionality
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                enterFullscreen();
            } else {
                exitFullscreen();
            }
        }

        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        // Background music functions
        function generateBackgroundMusic() {
            backgroundMusic = document.getElementById('backgroundMusic');
            
            // Create data URLs for peaceful background music
            const musicTracks = {
                peaceful1: generatePeacefulPiano(),
                peaceful2: generateNatureSounds(),
                peaceful3: generateAmbientWaves()
            };
            
            // Store music tracks
            window.musicTracks = musicTracks;
        }

        function generatePeacefulPiano() {
            // Generate a peaceful piano melody using Web Audio API
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const buffer = context.createBuffer(2, context.sampleRate * 30, context.sampleRate);
            
            for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                const channelData = buffer.getChannelData(channel);
                for (let i = 0; i < channelData.length; i++) {
                    const time = i / context.sampleRate;
                    // Create a peaceful piano-like sound with harmonics
                    channelData[i] = (
                        Math.sin(2 * Math.PI * 261.63 * time) * 0.3 * Math.exp(-time * 0.5) +
                        Math.sin(2 * Math.PI * 329.63 * time) * 0.2 * Math.exp(-time * 0.5) +
                        Math.sin(2 * Math.PI * 392.00 * time) * 0.1 * Math.exp(-time * 0.5)
                    ) * (0.1 + 0.1 * Math.sin(0.5 * time));
                }
            }
            
            return buffer;
        }

        function generateNatureSounds() {
            // Generate nature sounds (rain/wind)
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const buffer = context.createBuffer(2, context.sampleRate * 30, context.sampleRate);
            
            for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                const channelData = buffer.getChannelData(channel);
                for (let i = 0; i < channelData.length; i++) {
                    // Create white noise filtered for nature sounds
                    channelData[i] = (Math.random() * 2 - 1) * 0.1 * 
                        (1 + Math.sin(i * 0.0001)) * 
                        (1 + Math.sin(i * 0.00005));
                }
            }
            
            return buffer;
        }

        function generateAmbientWaves() {
            // Generate ambient wave sounds
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const buffer = context.createBuffer(2, context.sampleRate * 30, context.sampleRate);
            
            for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                const channelData = buffer.getChannelData(channel);
                for (let i = 0; i < channelData.length; i++) {
                    const time = i / context.sampleRate;
                    // Create ambient wave-like sounds
                    channelData[i] = (
                        Math.sin(2 * Math.PI * 0.1 * time) * 0.3 +
                        Math.sin(2 * Math.PI * 0.07 * time) * 0.2 +
                        Math.sin(2 * Math.PI * 0.13 * time) * 0.1
                    ) * 0.1 * (1 + Math.sin(0.05 * time));
                }
            }
            
            return buffer;
        }

        function playBackgroundMusic(trackName) {
            if (!backgroundMusic || trackName === 'none') return;
            
            try {
                // Create a simple looping tone for demonstration
                // In a real application, you would load actual audio files
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gainNode = context.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(context.destination);
                
                // Different frequencies for different tracks
                const frequencies = {
                    peaceful1: 220,
                    peaceful2: 110,
                    peaceful3: 165
                };
                
                oscillator.frequency.setValueAtTime(frequencies[trackName], context.currentTime);
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(musicVolume * 0.1, context.currentTime);
                
                oscillator.start();
                
                // Store reference for stopping
                window.currentOscillator = oscillator;
                window.currentGain = gainNode;
                
                isMusicPlaying = true;
                updateMusicButton();
                
            } catch (error) {
                console.log('Audio context not available');
            }
        }

        function stopBackgroundMusic() {
            if (window.currentOscillator) {
                window.currentOscillator.stop();
                window.currentOscillator = null;
                window.currentGain = null;
            }
            isMusicPlaying = false;
            updateMusicButton();
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                stopBackgroundMusic();
            } else {
                if (currentMusicTrack !== 'none') {
                    playBackgroundMusic(currentMusicTrack);
                }
            }
        }

        function updateMusicButton() {
            const button = document.getElementById('musicToggle');
            if (isMusicPlaying) {
                button.textContent = '🔇';
                button.classList.add('playing');
            } else {
                button.textContent = '🎵';
                button.classList.remove('playing');
            }
        }

        // Initialize the application when the page loads
        window.addEventListener('load', init);
    </script>
</body>
