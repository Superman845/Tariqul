<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice Tutor</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --error-color: #f44336;
            --success-color: #4CAF50;
            --key-bg: #f0f0f0;
            --key-border: #ccc;
            --key-active: #e0e0e0;
            --panel-bg: #f9f9f9;
            --border-color: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --key-bg: #333333;
            --key-border: #555555;
            --key-active: #444444;
            --panel-bg: #2a2a2a;
            --border-color: #555555;
        }

        [data-theme="night"] {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --key-bg: #21262d;
            --key-border: #30363d;
            --key-active: #373e47;
            --panel-bg: #161b22;
            --border-color: #30363d;
        }

        [data-theme="blue"] {
            --bg-color: #e3f2fd;
            --text-color: #0d47a1;
            --key-bg: #bbdefb;
            --key-border: #90caf9;
            --key-active: #64b5f6;
            --panel-bg: #f3e5f5;
            --border-color: #90caf9;
        }

        [data-theme="green"] {
            --bg-color: #e8f5e8;
            --text-color: #1b5e20;
            --key-bg: #c8e6c9;
            --key-border: #a5d6a7;
            --key-active: #81c784;
            --panel-bg: #f1f8e9;
            --border-color: #a5d6a7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            overflow-x: hidden;
            zoom: 140%;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .level-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .level-btn, .lesson-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: var(--key-bg);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-btn:hover, .lesson-btn:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .level-btn.active, .lesson-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .settings-btn {
            padding: 10px 20px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .stats-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--panel-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.7;
        }

        .typing-area {
            margin-bottom: 20px;
        }

        .text-display {
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: var(--panel-bg);
            font-family: 'Courier New', monospace;
            font-size: 24px;
            line-height: 1.6;
            min-height: 100px;
            overflow-y: auto;
            resize: vertical;
        }

        .char {
            font-size: inherit;
            transition: all 0.2s ease;
        }

        .char.correct {
            color: var(--success-color);
            background-color: rgba(76, 175, 80, 0.1);
        }

        .char.incorrect {
            color: var(--error-color);
            background-color: rgba(244, 67, 54, 0.1);
        }

        .char.current {
            background-color: var(--secondary-color);
            color: white;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .finger-hint {
            margin: 10px 0;
            padding: 10px;
            background: var(--panel-bg);
            border-radius: 5px;
            border: 1px solid var(--border-color);
            font-weight: bold;
            text-align: center;
        }

        .lesson-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .control-btn {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            background: var(--key-bg);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .keyboard {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            user-select: none;
            transition: all 0.3s ease;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .key {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            background: var(--key-bg);
            border: 2px solid var(--key-border);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            position: relative;
        }

        .key:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .key.active {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .key.next {
            background: var(--secondary-color);
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .key.space {
            min-width: 200px;
        }

        .key.shift, .key.ctrl, .key.alt {
            min-width: 60px;
        }

        .key.tab {
            min-width: 50px;
        }

        .key.caps {
            min-width: 70px;
        }

        .key.enter {
            min-width: 80px;
        }

        .key.backspace {
            min-width: 80px;
        }

        /* Keyboard Themes */
        .keyboard.gaming {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid #764ba2;
        }

        .keyboard.gaming .key {
            background: linear-gradient(145deg, #667eea, #764ba2);
            border: 2px solid #5a67d8;
            color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .keyboard.gaming .key:hover {
            background: linear-gradient(145deg, #764ba2, #667eea);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .keyboard.gaming .key.active {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
        }

        .keyboard.gaming .key.next {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            color: white;
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.8);
        }

        .keyboard.retro {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: 2px solid #f5576c;
        }

        .keyboard.retro .key {
            background: linear-gradient(145deg, #f093fb, #f5576c);
            border: 2px solid #e91e63;
            color: white;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .keyboard.retro .key:hover {
            background: linear-gradient(145deg, #f5576c, #f093fb);
            box-shadow: 0 0 10px rgba(240, 147, 251, 0.5);
        }

        .keyboard.retro .key.active {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
        }

        .keyboard.retro .key.next {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            color: white;
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.8);
        }

        .keyboard.neon {
            background: #0a0a0a;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .keyboard.neon .key {
            background: #1a1a1a;
            border: 2px solid #00ffff;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }

        .keyboard.neon .key:hover {
            background: #00ffff;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .keyboard.neon .key.active {
            background: #4CAF50;
            color: #000;
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
        }

        .keyboard.neon .key.next {
            background: #2196F3;
            color: #000;
            border-color: #2196F3;
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.8);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: var(--panel-bg);
            border-left: 2px solid var(--border-color);
            padding: 20px;
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .close-btn {
            background: var(--error-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #d32f2f;
            transform: scale(1.1);
        }

        .setting-group {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-color);
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .setting-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .setting-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .setting-select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .game-btn {
            padding: 10px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            border: 2px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .level-card {
            padding: 15px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .level-card:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .level-card.active {
            background: var(--primary-color);
            color: white;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .lesson-card {
            padding: 10px;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .lesson-card:hover {
            background: var(--key-active);
            transform: translateY(-2px);
        }

        .lesson-card.active {
            background: var(--primary-color);
            color: white;
        }

        .custom-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-btn:hover {
            background: #1976D2;
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header {
                flex-direction: column;
                gap: 10px;
            }
            
            .stats-display {
                flex-direction: column;
                gap: 10px;
            }
            
            .keyboard {
                padding: 10px;
            }
            
            .key {
                min-width: 30px;
                height: 30px;
                font-size: 12px;
            }
            
            .settings-panel {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <div class="header">
            <div class="level-selector">
                <button class="level-btn active" onclick="openLevelsModal()">Levels</button>
                <button class="lesson-btn" onclick="openLessonsModal()">Lessons</button>
                <button class="control-btn" onclick="showStats()">Stats</button>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>
        </div>

        <div class="stats-display">
            <div class="stat-item">
                <div class="stat-value" id="accuracy">100%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="speed">0</div>
                <div class="stat-label">WPM</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="errors">0</div>
                <div class="stat-label">Errors</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="time">0:00</div>
                <div class="stat-label">Time</div>
            </div>
        </div>

        <div class="typing-area">
            <div class="text-display" id="textDisplay"></div>
            <div class="finger-hint" id="fingerHint">Position your fingers on the home row</div>
        </div>

        <div class="lesson-controls">
            <button class="control-btn" onclick="restartLesson()">🔄 Restart</button>
            <button class="control-btn" onclick="nextLesson()">⏭️ Next Lesson</button>
        </div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3>Settings</h3>
            <button class="close-btn" onclick="closeSettings()">❌</button>
        </div>

        <div class="setting-group">
            <label class="setting-label">Theme</label>
            <select class="setting-select" id="themeSelect" onchange="changeTheme()">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="night">Night</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">Font Size</label>
            <input type="range" class="setting-input" id="fontSizeSlider" min="12" max="40" value="24" oninput="changeFontSize()">
            <span id="fontSizeValue">24px</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Zoom Level</label>
            <input type="range" class="setting-input" id="zoomSlider" min="50" max="200" value="140" oninput="changeZoom()">
            <span id="zoomValue">140%</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Keyboard Size</label>
            <input type="range" class="setting-input" id="keyboardSizeSlider" min="0.5" max="2" step="0.1" value="1" oninput="changeKeyboardSize()">
            <span id="keyboardSizeValue">100%</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Mistake Sound</label>
            <select class="setting-select" id="soundSelect" onchange="changeMistakeSound()">
                <option value="sound1">Sound 1</option>
                <option value="sound2">Sound 2</option>
                <option value="sound3">Sound 3</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">Text Box Rows</label>
            <input type="range" class="setting-input" id="textBoxRowsSlider" min="1" max="5" value="3" oninput="changeTextBoxRows()">
            <span id="textBoxRowsValue">3 rows</span>
        </div>

        <div class="setting-group">
            <label class="setting-label">Keyboard Theme</label>
            <select class="setting-select" id="keyboardThemeSelect" onchange="changeKeyboardTheme()">
                <option value="default">Default</option>
                <option value="gaming">Gaming</option>
                <option value="retro">Retro</option>
                <option value="neon">Neon</option>
            </select>
        </div>

        <div class="setting-group">
            <label class="setting-label">🎮 Typing Games</label>
            <div class="games-grid">
                <button class="game-btn" onclick="startSpeedRace()">Speed Race</button>
                <button class="game-btn" onclick="startWordCatch()">Word Catch</button>
                <button class="game-btn" onclick="startTypingDuel()">Typing Duel</button>
                <button class="game-btn" onclick="startAccuracyTest()">Accuracy Test</button>
                <button class="game-btn" onclick="startEndlessMode()">Endless Mode</button>
                <button class="game-btn" onclick="startKeyboardMaster()">Key Master</button>
            </div>
        </div>
    </div>

    <!-- Levels Modal -->
    <div class="modal" id="levelsModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3>Select Level</h3>
                    <p style="font-size: 12px; color: #666; margin-top: 5px;">Single-click to select, double-click to load</p>
                </div>
                <button class="close-btn" onclick="closeLevelsModal()">×</button>
            </div>
            <div class="custom-controls">
                <button class="control-btn" onclick="addCustomLevel()">Add Level</button>
                <button class="control-btn" onclick="editLevel()">Edit</button>
                <button class="control-btn" onclick="deleteLevel()">Delete</button>
                <button class="control-btn" onclick="resetLevels()">Reset</button>
            </div>
            <div class="levels-grid" id="levelsGrid"></div>
        </div>
    </div>

    <!-- Lessons Modal -->
    <div class="modal" id="lessonsModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3>Select Lesson</h3>
                    <p style="font-size: 12px; color: #666; margin-top: 5px;">Single-click to select, double-click to load</p>
                </div>
                <button class="close-btn" onclick="closeLessonsModal()">×</button>
            </div>
            <div class="custom-controls">
                <button class="control-btn" onclick="addCustomLesson()">Add Lesson</button>
                <button class="control-btn" onclick="editLesson()">Edit</button>
                <button class="control-btn" onclick="deleteLesson()">Delete</button>
                <button class="control-btn" onclick="resetLessons()">Reset</button>
            </div>
            <div class="lessons-grid" id="lessonsGrid"></div>
        </div>
    </div>

    <!-- Fullscreen Button -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

    <script>
        // Global variables
        let currentLevel = 'introduction';
        let currentLesson = 1;
        let currentText = '';
        let currentIndex = 0;
        let startTime = null;
        let errors = 0;
        let correctChars = 0;
        let totalChars = 0;
        let isShiftPressed = false;
        let timer = null;

        // Audio context for sounds
        let audioContext = null;
        let mistakeSounds = {
            sound1: null,
            sound2: null,
            sound3: null
        };
        let currentMistakeSound = 'sound1';

        // Predefined levels and lessons
        const defaultLevels = {
            introduction: {
                name: 'Introduction',
                description: 'Learn the basics of touch typing'
            },
            beginner: {
                name: 'Beginner',
                description: 'Start with home row keys'
            },
            intermediate: {
                name: 'Intermediate',
                description: 'Expand to all letters'
            },
            advanced: {
                name: 'Advanced',
                description: 'Numbers and special characters'
            },
            practice: {
                name: 'Practice',
                description: 'Real-world typing practice'
            }
        };

        const defaultLessons = {

        // Create virtual keyboard
        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            const rows = [
                ['`', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', 'backspace'],
                ['tab', 'q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', '[', ']', '\\'],
                ['caps', 'a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', "'", 'enter'],
                ['shift', 'z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/', 'shift'],
                ['ctrl', 'alt', 'space', 'alt', 'ctrl']
            ];

            keyboard.innerHTML = '';
            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                
                row.forEach(key => {
                    const keyDiv = document.createElement('div');
                    keyDiv.className = `key ${key}`;
                    keyDiv.setAttribute('data-key', key);
                    
                    if (key === 'space') {
                        keyDiv.textContent = '';
                        keyDiv.className += ' space';
                    } else if (key === 'backspace') {
                        keyDiv.textContent = '⌫';
                        keyDiv.className += ' backspace';
                    } else if (key === 'enter') {
                        keyDiv.textContent = '↵';
                        keyDiv.className += ' enter';
                    } else if (key === 'shift') {
                        keyDiv.textContent = '⇧';
                        keyDiv.className += ' shift';
                    } else if (key === 'tab') {
                        keyDiv.textContent = '⇥';
                        keyDiv.className += ' tab';
                    } else if (key === 'caps') {
                        keyDiv.textContent = '⇪';
                        keyDiv.className += ' caps';
                    } else if (key === 'ctrl') {
                        keyDiv.textContent = 'Ctrl';
                        keyDiv.className += ' ctrl';
                    } else if (key === 'alt') {
                        keyDiv.textContent = 'Alt';
                        keyDiv.className += ' alt';
                    } else {
                        keyDiv.textContent = key;
                    }
                    
                    rowDiv.appendChild(keyDiv);
                });
                
                keyboard.appendChild(rowDiv);
            });
        }

        // Handle key press
        function handleKeyDown(event) {
            const key = event.key;
            const keyCode = event.keyCode;
            
            // Handle shift key
            if (key === 'Shift') {
                isShiftPressed = true;
                updateKeyboardShift();
                return;
            }
            
            // Prevent default behavior for typing keys
            if (keyCode >= 32 && keyCode <= 126) {
                event.preventDefault();
            }
            
            // Highlight pressed key
            highlightKey(key);
            
            // Process the typed character
            processTypedCharacter(key);
        }

        function handleKeyUp(event) {
            const key = event.key;
            
            if (key === 'Shift') {
                isShiftPressed = false;
                updateKeyboardShift();
            }
            
            // Remove highlight from key
            removeKeyHighlight(key);
        }

        // Update keyboard display for shift state
        function updateKeyboardShift() {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                const keyData = key.getAttribute('data-key');
                if (isShiftPressed) {
                    switch(keyData) {
                        case '1': key.textContent = '!'; break;
                        case '2': key.textContent = '@'; break;
                        case '3': key.textContent = '#'; break;
                        case '4': key.textContent = '$'; break;
                        case '5': key.textContent = '%'; break;
                        case '6': key.textContent = '^'; break;
                        case '7': key.textContent = '&'; break;
                        case '8': key.textContent = '*'; break;
                        case '9': key.textContent = '('; break;
                        case '0': key.textContent = ')'; break;
                        case '-': key.textContent = '_'; break;
                        case '=': key.textContent = '+'; break;
                        case '[': key.textContent = '{'; break;
                        case ']': key.textContent = '}'; break;
                        case '\\': key.textContent = '|'; break;
                        case ';': key.textContent = ':'; break;
                        case "'": key.textContent = '"'; break;
                        case ',': key.textContent = '<'; break;
                        case '.': key.textContent = '>'; break;
                        case '/': key.textContent = '?'; break;
                        case '`': key.textContent = '~'; break;
                        default:
                            if (keyData.length === 1 && keyData.match(/[a-z]/)) {
                                key.textContent = keyData.toUpperCase();
                            }
                    }
                } else {
                    // Reset to normal state
                    if (keyData === 'space') {
                        key.textContent = '';
                    } else if (keyData === 'backspace') {
                        key.textContent = '⌫';
                    } else if (keyData === 'enter') {
                        key.textContent = '↵';
                    } else if (keyData === 'shift') {
                        key.textContent = '⇧';
                    } else if (keyData === 'tab') {
                        key.textContent = '⇥';
                    } else if (keyData === 'caps') {
                        key.textContent = '⇪';
                    } else if (keyData === 'ctrl') {
                        key.textContent = 'Ctrl';
                    } else if (keyData === 'alt') {
                        key.textContent = 'Alt';
                    } else {
                        key.textContent = keyData;
                    }
                }
            });
        }

        // Highlight key on keyboard
        function highlightKey(key) {
            const keyElement = document.querySelector(`[data-key="${key.toLowerCase()}"]`);
            if (keyElement) {
                keyElement.classList.add('active');
            }
            
            // Handle special keys
            if (key === ' ') {
                const spaceKey = document.querySelector('[data-key="space"]');
                if (spaceKey) spaceKey.classList.add('active');
            }
        }

        // Remove key highlight
        function removeKeyHighlight(key) {
            const keyElement = document.querySelector(`[data-key="${key.toLowerCase()}"]`);
            if (keyElement) {
                keyElement.classList.remove('active');
            }
            
            if (key === ' ') {
                const spaceKey = document.querySelector('[data-key="space"]');
                if (spaceKey) spaceKey.classList.remove('active');
            }
        }

        // Process typed character
        function processTypedCharacter(key) {
            if (currentIndex >= currentText.length) return;
            
            const expectedChar = currentText[currentIndex];
            const typedChar = key;
            
            // Start timer on first keypress
            if (startTime === null) {
                startTime = Date.now();
                startTimer();
            }
            
            const charElement = document.querySelector(`[data-index="${currentIndex}"]`);
            
            if (typedChar === expectedChar) {
                // Correct character
                charElement.classList.add('correct');
                correctChars++;
                currentIndex++;
                
                // Update next character highlight
                updateNextCharacterHighlight();
                updateFingerHint();
                
                // Check if lesson is complete
                if (currentIndex >= currentText.length) {
                    completeLesson();
                }
            } else {
                // Incorrect character
                charElement.classList.add('incorrect');
                errors++;
                playMistakeSound();
            }
            
            totalChars++;
            updateStats();
        }

        // Update next character highlight on keyboard
        function updateNextCharacterHighlight() {
            // Remove previous highlights
            document.querySelectorAll('.key.next').forEach(key => {
                key.classList.remove('next');
            });
            
            if (currentIndex < currentText.length) {
                const nextChar = currentText[currentIndex];
                let keyToHighlight = nextChar.toLowerCase();
                
                // Handle special characters
                if (nextChar === ' ') {
                    keyToHighlight = 'space';
                } else if (nextChar.match(/[A-Z]/)) {
                    keyToHighlight = nextChar.toLowerCase();
                    // Also highlight shift key
                    document.querySelectorAll('[data-key="shift"]').forEach(key => {
                        key.classList.add('next');
                    });
                } else if ('!@#$%^&*()_+{}|:"<>?~'.includes(nextChar)) {
                    // Handle shift + number/symbol combinations
                    const shiftMap = {
                        '!': '1', '@': '2', '#': '3', '$': '4', '%': '5',
                        '^': '6', '&': '7', '*': '8', '(': '9', ')': '0',
                        '_': '-', '+': '=', '{': '[', '}': ']', '|': '\\',
                        ':': ';', '"': "'", '<': ',', '>': '.', '?': '/',
                        '~': '`'
                    };
                    keyToHighlight = shiftMap[nextChar] || nextChar;
                    document.querySelectorAll('[data-key="shift"]').forEach(key => {
                        key.classList.add('next');
                    });
                }
                
                const keyElement = document.querySelector(`[data-key="${keyToHighlight}"]`);
                if (keyElement) {
                    keyElement.classList.add('next');
                }
            }
        }

        // Update finger hint
        function updateFingerHint() {
            const fingerHint = document.getElementById('fingerHint');
            
            if (currentIndex < currentText.length) {
                const nextChar = currentText[currentIndex].toLowerCase();
                const finger = fingerMap[nextChar] || 'appropriate finger';
                const charDisplay = currentText[currentIndex] === ' ' ? 'space' : currentText[currentIndex];
                
                let hint = `Next: "${charDisplay}" - Use ${finger}`;
                
                // Add shift instruction if needed
                if (currentText[currentIndex].match(/[A-Z]/) || '!@#$%^&*()_+{}|:"<>?~'.includes(currentText[currentIndex])) {
                    hint += ' (with Shift)';
                }
                
                fingerHint.textContent = hint;
            } else {
                fingerHint.textContent = 'Lesson complete!';
            }
        }

        // Load lesson text
        function loadLesson() {
            const levels = JSON.parse(localStorage.getItem('customLevels')) || defaultLevels;
            const lessons = JSON.parse(localStorage.getItem('customLessons')) || defaultLessons;
            
            currentText = lessons[currentLevel]?.[currentLesson] || 'Sample text for typing practice.';
            currentIndex = 0;
            errors = 0;
            correctChars = 0;
            totalChars = 0;
            startTime = null;
            
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            displayText();
            updateStats();
            updateNextCharacterHighlight();
            updateFingerHint();
        }

        // Display text with character spans
        function displayText() {
            const textDisplay = document.getElementById('textDisplay');
            textDisplay.innerHTML = '';
            
            for (let i = 0; i < currentText.length; i++) {
                const span = document.createElement('span');
                span.className = 'char';
                span.setAttribute('data-index', i);
                span.textContent = currentText[i];
                
                if (i === currentIndex) {
                    span.classList.add('current');
                }
                
                textDisplay.appendChild(span);
            }
        }

        // Update statistics
        function updateStats() {
            const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
            const timeElapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
            const wpm = timeElapsed > 0 ? Math.round((correctChars / 5) / (timeElapsed / 60)) : 0;
            
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('speed').textContent = wpm;
            document.getElementById('errors').textContent = errors;
        }

        // Start timer
        function startTimer() {
            timer = setInterval(() => {
                if (startTime) {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('time').textContent = 
                        `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Complete lesson
        function completeLesson() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            // Save lesson statistics
            saveLessonStats();
            
            // Show completion message
            setTimeout(() => {
                alert('Lesson completed! Great job!');
            }, 500);
        }

        function saveLessonStats() {
            const stats = JSON.parse(localStorage.getItem('lessonStats')) || {};
            const key = `${currentLevel}-${currentLesson}`;
            
            const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
            const timeElapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
            const wpm = timeElapsed > 0 ? Math.round((correctChars / 5) / (timeElapsed / 60)) : 0;
            
            stats[key] = {
                accuracy,
                wpm,
                errors,
                time: timeElapsed,
                date: new Date().toISOString()
            };
            
            localStorage.setItem('lessonStats', JSON.stringify(stats));
        }

        // Generate mistake sounds
        function generateMistakeSounds() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const frequencies = [800, 600, 400];
                
                frequencies.forEach((freq, index) => {
                    const soundKey = `sound${index + 1}`;
                    mistakeSounds[soundKey] = () => {
                        const oscillator = context.createOscillator();
                        const gainNode = context.createGain();
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(context.destination);
                        
                        oscillator.frequency.setValueAtTime(freq, context.currentTime);
                        oscillator.type = 'sine';
                        
                        gainNode.gain.setValueAtTime(0.1, context.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.2);
                        
                        oscillator.start(context.currentTime);
                        oscillator.stop(context.currentTime + 0.2);
                    };
                });
            } catch (error) {
                console.log('Audio context not available');
            }
        }

        // Play mistake sound
        function playMistakeSound() {
            if (mistakeSounds[currentMistakeSound]) {
                mistakeSounds[currentMistakeSound]();
            }

        // Load levels into modal
        function loadLevels() {
            const levels = JSON.parse(localStorage.getItem('customLevels')) || {...defaultLevels};
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';
            
            Object.keys(levels).forEach(levelKey => {
                const level = levels[levelKey];
                const card = document.createElement('div');
                card.className = 'level-card';
                if (levelKey === currentLevel) {
                    card.classList.add('active');
                }
                if (levelKey === selectedLevel) {
                    card.style.border = '3px solid #FF9800';
                    card.style.backgroundColor = '#FFF3E0';
                }
                
                // Add custom level indicator
                const isCustom = !defaultLevels[levelKey];
                card.innerHTML = `
                    <h4>${level.name} ${isCustom ? '(Custom)' : ''}</h4>
                    <p>${level.description}</p>
                `;
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    
                    // Double-click to load level
                    if (e.detail === 2) {
                        currentLevel = levelKey;
                        currentLesson = 1;
                        loadLesson();
                        closeLevelsModal();
                    } else {
                        // Single click to select
                        selectedLevel = levelKey;
                        loadLevels(); // Refresh to show selection
                    }
                };
                
                grid.appendChild(card);
            });
        }

        // Load lessons into modal
        function loadLessons() {
            const lessons = JSON.parse(localStorage.getItem('customLessons')) || {...defaultLessons};
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';
            
            const currentLevelLessons = lessons[currentLevel] || {};
            
            Object.keys(currentLevelLessons).forEach(lessonKey => {
                const card = document.createElement('div');
                card.className = 'lesson-card';
                if (parseInt(lessonKey) === currentLesson) {
                    card.classList.add('active');
                }
                if (lessonKey === selectedLesson) {
                    card.style.border = '3px solid #FF9800';
                    card.style.backgroundColor = '#FFF3E0';
                }
                
                // Check if it's a custom lesson
                const isCustom = !defaultLessons[currentLevel] || !defaultLessons[currentLevel][lessonKey];
                const lessonText = currentLevelLessons[lessonKey];
                const preview = lessonText.length > 30 ? lessonText.substring(0, 30) + '...' : lessonText;
                
                card.innerHTML = `
                    <h4>Lesson ${lessonKey} ${isCustom ? '(Custom)' : ''}</h4>
                    <p style="font-size: 12px; color: #666;">${preview}</p>
                `;
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    
                    // Double-click to load lesson
                    if (e.detail === 2) {
                        currentLesson = parseInt(lessonKey);
                        loadLesson();
                        closeLessonsModal();
                    } else {
                        // Single click to select
                        selectedLesson = lessonKey;
                        loadLessons(); // Refresh to show selection
                    }
                };
                
                grid.appendChild(card);
            });
        }

        function addCustomLevel() {
            const name = prompt('Enter level name:');
            const description = prompt('Enter level description:');
            
            if (name && description) {
                const levels = JSON.parse(localStorage.getItem('customLevels')) || {...defaultLevels};
                const key = name.toLowerCase().replace(/\s+/g, '_');
                levels[key] = { name, description };
                localStorage.setItem('customLevels', JSON.stringify(levels));
                loadLevels();
                alert('Level added successfully!');
            }
        }

        function addCustomLesson() {
            const text = prompt('Enter lesson text:');
            
            if (text) {
                const lessons = JSON.parse(localStorage.getItem('customLessons')) || {...defaultLessons};
                if (!lessons[currentLevel]) {
                    lessons[currentLevel] = {};
                }
                
                const lessonNumber = Object.keys(lessons[currentLevel]).length + 1;
                lessons[currentLevel][lessonNumber] = text;
                localStorage.setItem('customLessons', JSON.stringify(lessons));
                loadLessons();
                alert('Lesson added successfully!');
            }
        }

        function editLevel() {
            if (!selectedLevel) {
                alert('Please select a level first by clicking on it!');
                return;
            }
            
            const levels = JSON.parse(localStorage.getItem('customLevels')) || {...defaultLevels};
            const level = levels[selectedLevel];
            
            if (!level) {
                alert('Level not found!');
                return;
            }
            
            const newName = prompt('Enter new level name:', level.name);
            const newDescription = prompt('Enter new level description:', level.description);
            
            if (newName && newDescription) {
                levels[selectedLevel] = { name: newName, description: newDescription };
                localStorage.setItem('customLevels', JSON.stringify(levels));
                loadLevels();
                alert('Level updated successfully!');
            }
        }

        function editLesson() {
            if (!selectedLesson) {
                alert('Please select a lesson first by clicking on it!');
                return;
            }
            
            const lessons = JSON.parse(localStorage.getItem('customLessons')) || {...defaultLessons};
            const currentLevelLessons = lessons[currentLevel] || {};
            const lessonText = currentLevelLessons[selectedLesson];
            
            if (!lessonText) {
                alert('Lesson not found!');
                return;
            }
            
            const newText = prompt('Enter new lesson text:', lessonText);
            
            if (newText) {
                lessons[currentLevel][selectedLesson] = newText;
                localStorage.setItem('customLessons', JSON.stringify(lessons));
                loadLessons();
                alert('Lesson updated successfully!');
            }
        }

        function deleteLevel() {
            if (!selectedLevel) {
                alert('Please select a level first by clicking on it!');
                return;
            }
            
            // Don't allow deletion of default levels
            if (defaultLevels[selectedLevel]) {
                alert('Cannot delete default levels! You can only delete custom levels.');
                return;
            }
            
            if (confirm(`Are you sure you want to delete the level "${selectedLevel}"?`)) {
                const levels = JSON.parse(localStorage.getItem('customLevels')) || {...defaultLevels};
                delete levels[selectedLevel];
                localStorage.setItem('customLevels', JSON.stringify(levels));
                
                // If current level was deleted, switch to introduction
                if (currentLevel === selectedLevel) {
                    currentLevel = 'introduction';
                    currentLesson = 1;
                    loadLesson();
                }
                
                selectedLevel = null;
                loadLevels();
                alert('Level deleted successfully!');
            }
        }

        function deleteLesson() {
            if (!selectedLesson) {
                alert('Please select a lesson first by clicking on it!');
                return;
            }
            
            const lessons = JSON.parse(localStorage.getItem('customLessons')) || {...defaultLessons};
            const currentLevelLessons = lessons[currentLevel] || {};
            
            // Don't allow deletion if it's the only lesson
            if (Object.keys(currentLevelLessons).length <= 1) {
                alert('Cannot delete the only lesson in a level!');
                return;
            }
            
            if (confirm(`Are you sure you want to delete lesson ${selectedLesson}?`)) {
                delete lessons[currentLevel][selectedLesson];
                
                // Reorganize lesson numbers
                const remainingLessons = Object.keys(lessons[currentLevel]).sort((a, b) => parseInt(a) - parseInt(b));
                const newLessons = {};
                remainingLessons.forEach((key, index) => {
                    newLessons[index + 1] = lessons[currentLevel][key];
                });
                lessons[currentLevel] = newLessons;
                
                localStorage.setItem('customLessons', JSON.stringify(lessons));
                
                // If current lesson was deleted, switch to lesson 1
                if (currentLesson === parseInt(selectedLesson)) {
                    currentLesson = 1;
                    loadLesson();
                }
                
                selectedLesson = null;
                loadLessons();
                alert('Lesson deleted successfully!');
            }
        }

        function resetLevels() {
            if (confirm('Reset all levels to default? This will remove all custom levels!')) {
                localStorage.removeItem('customLevels');
                selectedLevel = null;
                
                // Reset to default level if current level was custom
                if (!defaultLevels[currentLevel]) {
                    currentLevel = 'introduction';
                    currentLesson = 1;
                    loadLesson();
                }
                
                loadLevels();
                alert('All levels reset to default!');
            }
        }

        function resetLessons() {
            if (confirm('Reset all lessons to default? This will remove all custom lessons!')) {
                localStorage.removeItem('customLessons');
                selectedLesson = null;
                currentLesson = 1;
                loadLesson();
                loadLessons();
                alert('All lessons reset to default!');
            }
        }

        // Lesson control functions
        function restartLesson() {
            loadLesson();
        }

        function nextLesson() {
            const lessons = JSON.parse(localStorage.getItem('customLessons')) || defaultLessons;
            const currentLevelLessons = lessons[currentLevel] || {};
            const maxLesson = Math.max(...Object.keys(currentLevelLessons).map(Number));
            
            if (currentLesson < maxLesson) {
                currentLesson++;
                loadLesson();
            } else {
                alert('You have completed all lessons in this level!');
            }
        }

        // Show statistics
        function showStats() {
            const stats = JSON.parse(localStorage.getItem('lessonStats')) || {};
            const key = `${currentLevel}-${currentLesson}`;
            const lessonStats = stats[key];
            
            if (lessonStats) {
                alert(`Lesson Statistics:
                Accuracy: ${lessonStats.accuracy}%
                Speed: ${lessonStats.wpm} WPM
                Errors: ${lessonStats.errors}
                Time: ${Math.floor(lessonStats.time / 60)}:${Math.floor(lessonStats.time % 60).toString().padStart(2, '0')}
                Date: ${new Date(lessonStats.date).toLocaleDateString()}`);
            } else {
                alert('No statistics available for this lesson yet.');
            }
        }

        // Handle body clicks to close settings
        function handleBodyClick(event) {
            const settingsPanel = document.getElementById('settingsPanel');
            const settingsBtn = document.querySelector('.settings-btn');
            
            if (!settingsPanel.contains(event.target) && !settingsBtn.contains(event.target)) {
                settingsPanel.classList.remove('open');
            }
        }

        // Fullscreen functionality
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                enterFullscreen();
            } else {
                exitFullscreen();
            }
        }

        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        // Game functions
        function startSpeedRace() {
            alert('🏁 Speed Race Game\n\nType as fast as you can!\nGoal: Achieve 60+ WPM\n\nClick OK to start!');
            currentText = 'The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump!';
            loadLesson();
            closeSettings();
        }

        function startWordCatch() {
            alert('🎯 Word Catch Game\n\nCatch falling words by typing them!\nMiss 3 words and you lose!\n\nClick OK to start!');
            currentText = 'apple banana cherry date elderberry fig grape honeydew kiwi lemon mango orange peach';
            loadLesson();
            closeSettings();
        }

        function startTypingDuel() {
            alert('⚔️ Typing Duel Game\n\nRace against the computer!\nFirst to finish wins!\n\nClick OK to start!');
            currentText = 'In the realm of digital warriors, only the fastest fingers survive the ultimate typing challenge.';
            loadLesson();
            closeSettings();
        }

        function startAccuracyTest() {
            alert('🎯 Accuracy Test Game\n\nType with 100% accuracy!\nOne mistake and you restart!\n\nClick OK to start!');
            currentText = 'Precision is the key to mastery. Every character matters in this ultimate accuracy challenge.';
            loadLesson();
            closeSettings();
        }

        function startEndlessMode() {
            alert('♾️ Endless Mode Game\n\nType continuously without stopping!\nSee how long you can last!\n\nClick OK to start!');
            currentText = 'Welcome to endless typing mode. The challenge never stops. Keep typing to survive. Your endurance will be tested.';
            loadLesson();
            closeSettings();
        }

        function startKeyboardMaster() {
            alert('⌨️ Keyboard Master Game\n\nMaster all keys on the keyboard!\nNumbers, symbols, and letters!\n\nClick OK to start!');
            currentText = 'Master123! @#$%^&*()_+ {}|:"<>? ~`-=[]\\;\',./';
            loadLesson();
            closeSettings();
        }

        // Initialize the application when the page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
